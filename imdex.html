<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Electron</title>

<style>
* {
box-sizing: border-box;
}

html, body {
margin: 0;
width: 100%;
height: 100%;
background: white;
font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
font-weight: 300;
color: #222;
}

body {
overflow: hidden;
}

.electron {
width: 100%;
height: 100%;
height: 100dvh;
display: flex;
flex-direction: column;
animation: swipeUp 0.8s ease-out;
}

.header {
flex-shrink: 0;
padding: 50px 60px 20px;
}

.ring {
width: 80px;
height: 80px;
border: 7px solid #007aff;
border-radius: 50%;
margin-bottom: 25px;
}

.welcome {
font-size: 32px;
line-height: 1.35;
min-height: 45px;
transition: opacity 0.3s ease, transform 0.3s ease;
}

.welcome.swipe {
opacity: 0;
transform: translateY(-25px);
}

.welcome.swipe-in {
opacity: 1;
transform: translateY(0);
}

.conversation {
flex: 1;
min-height: 0;
overflow-y: auto;
overscroll-behavior: contain;
padding: 20px 60px 35px;
scroll-behavior: smooth;
}

.message {
max-width: 850px;
margin-bottom: 28px;
animation: messageUp 0.35s ease-out;
overflow-wrap: anywhere;
}

.sender {
font-size: 17px;
color: #777;
margin-bottom: 5px;
}

.messageText {
font-size: 25px;
line-height: 1.45;
white-space: pre-wrap;
}

.searchLink {
color: #b38c00;
text-decoration: underline;
cursor: pointer;
}

.searchLink:hover {
color: #806500;
}

.timerDisplay {
font-size: 30px;
margin-top: 8px;
font-variant-numeric: tabular-nums;
}

.thinking {
font-size: 22px;
color: #777;
animation: thinkingPulse 1.2s infinite;
}

.inputArea {
flex-shrink: 0;
padding: 20px 60px 30px;
padding-bottom: max(25px, env(safe-area-inset-bottom));
background: rgba(255,255,255,0.97);
}

.inputBox {
max-width: 900px;
display: flex;
align-items: center;
border-bottom: 1px solid #aaa;
}

#userInput {
flex: 1;
min-width: 0;
border: none;
outline: none;
background: transparent;
font-family: inherit;
font-size: 21px;
font-weight: 300;
padding: 12px 0;
color: #222;
}

#userInput::placeholder {
color: #999;
}

button {
border: none;
background: transparent;
font-family: inherit;
font-size: 18px;
cursor: pointer;
padding: 10px 0 10px 18px;
color: #333;
}

button:hover {
color: #b38c00;
}

button:focus-visible,
input:focus-visible,
a:focus-visible {
outline: 2px solid #007aff;
outline-offset: 4px;
}

@keyframes swipeUp {
from {
opacity: 0;
transform: translateY(70px);
}
to {
opacity: 1;
transform: translateY(0);
}
}

@keyframes messageUp {
from {
opacity: 0;
transform: translateY(15px);
}
to {
opacity: 1;
transform: translateY(0);
}
}

@keyframes thinkingPulse {
0%, 100% { opacity: 0.45; }
50% { opacity: 1; }
}

/* =========================================
ANSWERS FROM THE ENGINE
(summary, picture, tool boxes, sources)
========================================= */

.messageText.answer {
white-space: normal;
}

.answerText {
margin: 0 0 14px;
}

.answerImage {
display: block;
width: 100%;
max-width: 320px;
height: 210px;
object-fit: cover;
object-position: center 25%;
border-radius: 18px;
margin: 4px 0 16px;
background: #f2f2f2;
}

.answerHeading {
font-size: 15px;
color: #777;
letter-spacing: 0.06em;
text-transform: uppercase;
margin: 18px 0 8px;
}

.answerPoints,
.answerSources {
margin: 0;
padding-left: 22px;
font-size: 19px;
line-height: 1.5;
}

.answerPoints li,
.answerSources li {
margin-bottom: 8px;
}

.answerPoints b {
font-weight: 500;
}

.answerSite {
color: #999;
font-size: 15px;
}

.answerNote {
color: #777;
font-size: 19px;
}

.answerRelated {
display: flex;
flex-wrap: wrap;
gap: 8px;
}

button.relatedChip {
font-size: 17px;
padding: 8px 14px;
border: 1px solid #ddd;
border-radius: 999px;
color: #333;
text-align: left;
}

button.relatedChip:hover {
border-color: #b38c00;
}

.answerActions {
display: flex;
gap: 22px;
margin-top: 14px;
}

button.answerButton {
padding: 6px 0;
font-size: 16px;
color: #777;
text-decoration: underline;
}

.answerWhy {
font-size: 14px;
color: #aaa;
margin-top: 8px;
}

/* Tool boxes made by the engine
(calculator, weather card, clock, dictionary) */

.answerTool .box {
border: 1px solid #e3e3e3;
border-radius: 18px;
padding: 16px 18px;
margin: 4px 0 16px;
max-width: 560px;
}

.answerTool .big {
font-size: 38px;
line-height: 1.2;
margin: 4px 0 8px;
}

.answerTool .grad {
color: #007aff;
}

.answerTool .muted {
color: #777;
}

.answerTool .small {
font-size: 15px;
}

.answerTool .wx {
display: flex;
align-items: center;
gap: 16px;
flex-wrap: wrap;
}

.answerTool .icon {
font-size: 52px;
line-height: 1;
}

.answerTool .wx-days {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(76px, 1fr));
gap: 8px;
margin-top: 14px;
}

.answerTool .wx-days div {
background: #f5f5f5;
border-radius: 12px;
padding: 8px;
text-align: center;
font-size: 15px;
line-height: 1.4;
}

.answerTool ul,
.answerTool ol {
font-size: 19px;
}

@media (max-width: 600px) {
.answerPoints,
.answerSources,
.answerNote {
font-size: 17px;
}

.answerTool .big {
font-size: 32px;
}

.answerImage {
height: 180px;
}
}

@media (max-width: 600px) {
.header {
padding: 30px 25px 10px;
}

.conversation {
padding: 20px 25px 30px;
}

.inputArea {
padding-left: 25px;
padding-right: 25px;
}

.ring {
width: 65px;
height: 65px;
border-width: 6px;
margin-bottom: 20px;
}

.welcome {
font-size: 26px;
}

.messageText {
font-size: 22px;
}

#userInput {
font-size: 19px;
}
}

@media (prefers-reduced-motion: reduce) {
*, *::before, *::after {
animation-duration: 0.01ms !important;
animation-iteration-count: 1 !important;
scroll-behavior: auto !important;
transition-duration: 0.01ms !important;
}
}
</style>
</head>

<body>

<div class="electron">

<header class="header">
<div class="ring" aria-hidden="true"></div>
<div id="welcome" class="welcome" aria-live="polite">
How can I help you?
</div>
</header>

<main
id="conversation"
class="conversation"
aria-live="polite"
aria-label="Conversation"
></main>

<form id="inputForm" class="inputArea">
<div class="inputBox">
<input
id="userInput"
type="text"
placeholder="Ask Electron..."
autocomplete="off"
aria-label="Ask Electron"
>
<button type="submit">Send</button>
</div>
</form>

</div>

<script>
"use strict";

/* =========================================
ELECTRON 3.0 SPECIAL EDITION
NO-AI EDITION

How Electron thinks (no AI model inside!):
1. ELECTRON COMMANDS - its own replies for
   greetings, timers, date, time, weather
   at home, opening sites, and more.
2. THE ANSWER ENGINE - for everything else:
   a) quick "tools" picked by patterns
      (math, units, binary, dictionary,
      weather anywhere, time in a city,
      countdowns, dice, jokes, facts...)
   b) the SUMMARY: search Wikipedia, cut the
      articles into sentences, give every
      sentence a score (TF-IDF), and show
      the best ones + a picture + sources.
Free data used (no keys): Wikipedia,
Wiktionary, Open-Meteo.
This file is pure ASCII on purpose: emoji
and special characters are written as
\u escapes (JS) or &...; entities (HTML),
so they can never turn into weird symbols.
========================================= */

const conversation =
document.getElementById("conversation");

const input =
document.getElementById("userInput");

const welcome =
document.getElementById("welcome");

let waitingIndex = 0;
let timerInterval = null;
let timerEndTime = null;
let requestNumber = 0;

/* What the engine remembers about the last
answer, so "another one" and follow-up
questions like "how old is she" work. */
let engineMemory = {};

/* =========================================
ROTATING WELCOME TEXT
========================================= */

const waitingMessages = [
"How can I help you?",
"Go ahead, I\u2019m listening.",
"You can type on the line below."
];

setInterval(() => {
welcome.classList.remove("swipe-in");
welcome.classList.add("swipe");

setTimeout(() => {
waitingIndex =
(waitingIndex + 1) % waitingMessages.length;

welcome.textContent =
waitingMessages[waitingIndex];

welcome.classList.remove("swipe");
void welcome.offsetWidth;
welcome.classList.add("swipe-in");
}, 300);
}, 4000);

/* =========================================
MESSAGE HELPERS
Text is inserted safely instead of being
interpreted as HTML.
========================================= */

function scrollDown() {
conversation.scrollTop =
conversation.scrollHeight;
}

function createMessage(sender) {
const message = document.createElement("div");
message.className = "message";

const senderElement = document.createElement("div");
senderElement.className = "sender";
senderElement.textContent = sender;

const textElement = document.createElement("div");
textElement.className = "messageText";

message.append(senderElement, textElement);
conversation.appendChild(message);

return { message, textElement };
}

function addUserMessage(text) {
const { textElement } = createMessage("You");
textElement.textContent = text;
scrollDown();
}

function addElectronMessage(text) {
const { textElement } = createMessage("Electron");
textElement.textContent = String(text);
scrollDown();
}

function addElectronLinkMessage(prefix, label, url) {
const { textElement } = createMessage("Electron");

textElement.appendChild(
document.createTextNode(prefix)
);

const link = document.createElement("a");
link.className = "searchLink";
link.textContent = label;
link.href = url;
link.target = "_blank";
link.rel = "noopener noreferrer";

textElement.appendChild(link);
scrollDown();
}

function addElectronRichMessage(parts) {
const { textElement } = createMessage("Electron");

for (const part of parts) {
if (part.type === "link") {
const link = document.createElement("a");
link.className = "searchLink";
link.textContent = part.label;
link.href = part.url;
link.target = "_blank";
link.rel = "noopener noreferrer";
textElement.appendChild(link);
} else {
textElement.appendChild(
document.createTextNode(part.text)
);
}
}

scrollDown();
}

function addThinking() {
removeThinking();

const { message, textElement } =
createMessage("Electron");

message.id = "thinkingMessage";
textElement.className = "thinking";
textElement.textContent = "\u2026";

scrollDown();
}

function removeThinking() {
const thinking =
document.getElementById("thinkingMessage");

if (thinking) {
thinking.remove();
}
}

/* =========================================
NORMALIZE COMMANDS
========================================= */

function normalize(text) {
return text
.toLocaleLowerCase()
.trim()
.replace(/[?!.,]+$/g, "")
.trim()
.replace(/\s+/g, " ");
}

/* =========================================
TIMER
========================================= */

function startTimer(minutes) {
if (timerInterval) {
clearInterval(timerInterval);
timerInterval = null;
}

const oldTimer =
document.getElementById("timerMessage");

if (oldTimer) {
oldTimer.remove();
}

timerEndTime =
Date.now() + minutes * 60 * 1000;

const { message, textElement } =
createMessage("Electron");

message.id = "timerMessage";

textElement.textContent =
"Timer set for " +
minutes +
" minute" +
(minutes === 1 ? "" : "s") +
".";

const display = document.createElement("div");
display.id = "timerDisplay";
display.className = "timerDisplay";
display.textContent = minutes + ":00";

message.appendChild(display);
scrollDown();

updateTimer();
timerInterval = setInterval(updateTimer, 250);
}

function updateTimer() {
if (timerEndTime === null) {
return;
}

const remaining =
Math.max(0, timerEndTime - Date.now());

const totalSeconds =
Math.ceil(remaining / 1000);

const minutes =
Math.floor(totalSeconds / 60);

const seconds =
totalSeconds % 60;

const display =
document.getElementById("timerDisplay");

if (display) {
display.textContent =
minutes + ":" +
String(seconds).padStart(2, "0");
}

if (remaining <= 0) {
clearInterval(timerInterval);
timerInterval = null;
timerEndTime = null;

if (display) {
display.textContent = "0:00";
}

addElectronMessage("Your timer is done!");

if ("Notification" in window) {
if (Notification.permission === "granted") {
new Notification("Electron", {
body: "Your timer is done!"
});
}
}
}
}

function cancelTimer() {
if (!timerInterval) {
return false;
}

clearInterval(timerInterval);
timerInterval = null;
timerEndTime = null;

const timer =
document.getElementById("timerMessage");

if (timer) {
timer.remove();
}

addElectronMessage("Timer cancelled.");
return true;
}

/* =========================================
DATE AND TIME
========================================= */

function getDate() {
return new Date().toLocaleDateString(
undefined,
{
weekday: "long",
month: "long",
day: "numeric",
year: "numeric"
}
);
}

function getTime() {
return new Date().toLocaleTimeString(
undefined,
{
hour: "numeric",
minute: "2-digit"
}
);
}

function getGreeting() {
const hour = new Date().getHours();

if (hour < 12) {
return "Good morning!";
}

if (hour < 17) {
return "Good afternoon!";
}

return "Good evening!";
}

/* =========================================
WEATHER - OPEN-METEO (your home spot)
========================================= */

async function getWeather() {
try {
const url =
"https://api.open-meteo.com/v1/forecast" +
"?latitude=40.7450" +
"&longitude=-73.0530" +
"&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m" +
"&temperature_unit=fahrenheit" +
"&wind_speed_unit=mph" +
"&timezone=America%2FNew_York";

const response = await fetch(url);

if (!response.ok) {
throw new Error("Weather service unavailable");
}

const data = await response.json();
const current = data.current;

const conditions = {
0: "clear skies \u2600\ufe0f",
1: "mostly clear \ud83c\udf24\ufe0f",
2: "partly cloudy \u26c5",
3: "cloudy \u2601\ufe0f",
45: "foggy \ud83c\udf2b\ufe0f",
48: "foggy \ud83c\udf2b\ufe0f",
51: "light drizzle \ud83c\udf26\ufe0f",
53: "drizzle \ud83c\udf26\ufe0f",
55: "heavy drizzle \ud83c\udf27\ufe0f",
61: "light rain \ud83c\udf26\ufe0f",
63: "rain \ud83c\udf27\ufe0f",
65: "heavy rain \ud83c\udf27\ufe0f",
71: "light snow \ud83c\udf28\ufe0f",
73: "snow \ud83c\udf28\ufe0f",
75: "heavy snow \u2744\ufe0f",
80: "rain showers \ud83c\udf26\ufe0f",
81: "rain showers \ud83c\udf27\ufe0f",
82: "heavy rain showers \ud83c\udf27\ufe0f",
95: "thunderstorms \u26c8\ufe0f",
96: "thunderstorms with hail \u26c8\ufe0f",
99: "thunderstorms with hail \u26c8\ufe0f"
};

const description =
conditions[current.weather_code] ||
"current conditions";

addElectronMessage(
"Right now, it\u2019s " +
Math.round(current.temperature_2m) +
"\u00b0F, with " + description +
". Feels like " +
Math.round(current.apparent_temperature) +
"\u00b0F, with winds around " +
Math.round(current.wind_speed_10m) +
" mph."
);
} catch (error) {
addElectronRichMessage([
{
type: "text",
text: "I couldn't get the weather right now. "
},
{
type: "link",
label: "Check the weather on the web.",
url: "https://www.google.com/search?q=weather"
}
]);
}
}

/* =========================================
GOOGLE SEARCH
========================================= */

function webSearchReply(query) {
addElectronRichMessage([
{
type: "text",
text: "I found something that may help: "
},
{
type: "link",
label: "Search the web for \u201c" + query + "\u201d",
url: "https://www.google.com/search?q=" +
encodeURIComponent(query)
}
]);
}

/* =========================================
COMMAND LIST
========================================= */

function showCommands() {
addElectronMessage(
`Electron's commands

ASSISTANT
Hello / Hi / Hey
How are you?
Who are you?
What is your name?
What can you do?

}

/* =========================================
ANSWER ENGINE -> ELECTRON'S CHAT
The engine (below) returns an "answer
object" like:
  { kind, badge, paras, bullets, html,
    image, sources, related, plain, why }
These functions turn it into Electron's
own message style.
========================================= */

async function answerWithEngine(text, currentRequest, variant = 0) {
  addThinking();

  let answer;

  try {
    answer = await route(text, engineMemory, variant);
  } catch (error) {
    console.error("Electron engine error:", error);
    answer = troubleAnswer(text);
  }

  // A newer question was sent while we were busy? Drop this one.
  if (currentRequest !== requestNumber) {
    return;
  }

  removeThinking();
  const memoryBefore = engineMemory;
  rememberAnswer(text, answer);
  addElectronAnswer(answer, text, variant, memoryBefore);
}

// Something broke (no internet, a site is down...)
function troubleAnswer(text) {
  return {
    kind: "error",
    paras: [
      navigator.onLine
        ? "Something went wrong while I was looking that up. Try again in a sec, or reword the question."
        : "You look offline. I need the internet for summaries and weather, but math, units, jokes and timers still work."
    ],
    plain: "Something went wrong.",
    sources: [{
      title: "Search the web for \u201c" + text + "\u201d",
      url: "https://www.google.com/search?q=" + encodeURIComponent(text),
      site: "Google"
    }]
  };
}

// Save what this answer was about, for follow-up questions.
function rememberAnswer(text, answer) {
  engineMemory = {
    lastKind: answer.kind,
    lastAgain: !!answer.again,
    lastQuery: text,
    topic: answer.topic || engineMemory.topic
  };
}

// Small helper: make an element with a class (and optional text)
function make(tag, className, text) {
  const element = document.createElement(tag);
  if (className) element.className = className;
  if (text !== undefined) element.textContent = text;
  return element;
}

function addElectronAnswer(answer, question, variant, memoryBefore) {
  const { message, textElement } = createMessage("Electron");
  fillAnswer(message, textElement, answer, question, variant, memoryBefore);
  scrollDown();
}

function fillAnswer(message, textElement, answer, question, variant, memoryBefore) {
  // Rich answers use their own layout (not the plain pre-wrap text style)
  textElement.className = "messageText answer";
  textElement.innerHTML = "";

  // "Electron  -  Summary from 3 sources"
  const sender = message.querySelector(".sender");
  sender.textContent = "Electron" + (answer.badge ? "  \u00b7  " + answer.badge : "");

  // Picture from the article (if it has one)
  if (answer.image) {
    const img = make("img", "answerImage");
    img.src = answer.image.src;
    img.alt = answer.image.alt || "";
    img.loading = "lazy";
    img.onerror = () => img.remove();
    img.onload = () => scrollDown();
    textElement.appendChild(img);
  }

  // Tool boxes (calculator, weather card, clock...). The engine builds
  // this HTML itself and escapes every outside text with esc().
  if (answer.html) {
    const box = make("div", "answerTool");
    box.innerHTML = answer.html;
    textElement.appendChild(box);
  }

  // The summary paragraph(s). md() turns **word** into bold safely.
  for (const para of answer.paras || []) {
    const p = make("p", "answerText");
    p.innerHTML = md(para);
    textElement.appendChild(p);
  }

  // Key points (best sentence from different parts of the article)
  if (answer.bullets && answer.bullets.length) {
    const heading = answer.kind === "define" ? "Meanings" : answer.kind === "wiki" ? "Key points" : "";
    if (heading) textElement.appendChild(make("div", "answerHeading", heading));
    const list = make("ul", "answerPoints");
    for (const bullet of answer.bullets) {
      const li = document.createElement("li");
      li.appendChild(make("b", "", cap(bullet.h) + ": "));
      li.appendChild(document.createTextNode(bullet.t));
      list.appendChild(li);
    }
    textElement.appendChild(list);
  }

  if (answer.tail) {
    const p = make("p", "answerNote");
    p.innerHTML = md(answer.tail);
    textElement.appendChild(p);
  }

  // Sources, as Electron's gold links
  if (answer.sources && answer.sources.length) {
    textElement.appendChild(make("div", "answerHeading", "Sources"));
    const list = make("ol", "answerSources");
    for (const source of answer.sources) {
      const li = document.createElement("li");
      const link = make("a", "searchLink", source.title);
      link.href = source.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      li.appendChild(link);
      if (source.site) li.appendChild(make("span", "answerSite", "  " + source.site));
      list.appendChild(li);
    }
    textElement.appendChild(list);
  }

  // "You could also ask" - tap one to ask it
  if (answer.related && answer.related.length) {
    textElement.appendChild(make("div", "answerHeading", "You could also ask"));
    const row = make("div", "answerRelated");
    for (const q of answer.related) {
      const chip = make("button", "relatedChip", q);
      chip.type = "button";
      chip.addEventListener("click", () => askFromButton(q));
      row.appendChild(chip);
    }
    textElement.appendChild(row);
  }

  // Buttons: other sentences (for summaries) + copy
  const actions = make("div", "answerActions");

  if (answer.kind === "wiki") {
    const again = make("button", "answerButton", "Other sentences");
    again.type = "button";
    again.title = "Pick the next-best sentences from the same articles";
    again.addEventListener("click", () =>
      regenerateAnswer(message, textElement, question, variant + 1, memoryBefore)
    );
    actions.appendChild(again);
  }

  if (answer.plain) {
    const copy = make("button", "answerButton", "Copy");
    copy.type = "button";
    copy.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(answer.plain);
        copy.textContent = "Copied";
      } catch {
        copy.textContent = "Can\u2019t copy here";
      }
      setTimeout(() => { copy.textContent = "Copy"; }, 1500);
    });
    actions.appendChild(copy);
  }

  if (actions.children.length) textElement.appendChild(actions);

  // A tiny line that shows how the answer was made
  if (answer.why) textElement.appendChild(make("div", "answerWhy", answer.why));
}

// "Other sentences": ask the engine again with variant + 1
async function regenerateAnswer(message, textElement, question, variant, memoryBefore) {
  textElement.className = "messageText thinking";
  textElement.textContent = "\u2026";

  let answer;
  try {
    answer = await route(question, memoryBefore || {}, variant);
  } catch (error) {
    console.error("Electron engine error:", error);
    answer = troubleAnswer(question);
  }

  fillAnswer(message, textElement, answer, question, variant, memoryBefore);
}

// Related-question chips type the question for you and send it
function askFromButton(question) {
  input.value = question;
  askElectron();
}

/* =========================================
THE ANSWER ENGINE
(the "summary technique")
No AI here either - just rules, regular
expressions and word-scoring math.
PART 1  word tools (used by summaries)
PART 2  the Wikipedia summary
PART 3  skills: calculator, units, binary,
        dictionary, weather, time, random,
        jokes, facts, small talk
PART 4  the router that picks a skill
========================================= */


/* ---------- tiny helpers ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
// Turn any text into safe HTML (so Wikipedia text can never inject code)
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// Our mini markdown: **bold** only (turns **word** into bold text)
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const fmtNum = n => {
  if (!isFinite(n)) return String(n);
  if (Number.isInteger(n) && Math.abs(n) < 1e15) return n.toLocaleString("en-US");
  if (Math.abs(n) >= 1e15 || (Math.abs(n) < 1e-6 && n !== 0)) return n.toExponential(6).replace(/\.?0+e/, "e");
  return parseFloat(n.toPrecision(10)).toLocaleString("en-US", {maximumFractionDigits: 10});
};

// fetch JSON with a timeout so the app never hangs forever
async function getJSON(url, ms = 9000) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(url, {signal: ctrl.signal});
    if (!r.ok) { const e = new Error("HTTP " + r.status); e.status = r.status; throw e; }
    return await r.json();
  } finally { clearTimeout(t); }
}

/* =====================================================================
   PART 1 - WORD TOOLS (used by the summary engine)
   ===================================================================== */
// "Stop words" = tiny words that don't tell us what a question is ABOUT
const STOP = new Set(("a an the is are was were be been being am do does did done doing have has had having " +
  "i me my mine you your yours he him his she her hers it its they them their we us our this that these those " +
  "what whats who whos whom whose which when where why how hows can could should would will shall may might must " +
  "of in on at to for from by with about as into onto over under than then there here so and or but not no yes if " +
  "tell explain describe give show please know want wanna like just really very some any much many more most " +
  "work works working mean means meaning define definition info information thing things something stuff " +
  "make made get got use used also does doesnt dont isnt arent wasnt one ones s t did lot kind type sort all").split(" "));

// Very small "stemmer": volcanoes -> volcano, working -> work, cities -> city
function stem(w) {
  if (w.length <= 3) return w;
  if (w.endsWith("ies") && w.length > 4) return w.slice(0, -3) + "y";
  if (/(ches|shes|sses|xes|zes|oes)$/.test(w)) return w.slice(0, -2);
  if (w.endsWith("s") && !w.endsWith("ss") && !w.endsWith("us") && !w.endsWith("is")) w = w.slice(0, -1);
  if (w.endsWith("tion") && w.length > 7) return w.slice(0, -3);   // invention -> invent
  if (w.endsWith("ing") && w.length > 5) w = w.slice(0, -3);
  else if (w.endsWith("ed") && w.length > 4) w = w.slice(0, -2);
  return w;
}
// split text into lowercase words
const words = s => (s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").match(/[a-z0-9]+/g) || []);
// the important words, stemmed
const keyTerms = s => words(s).filter(w => !STOP.has(w)).map(stem);

// Cut a big text into sentences, being careful with "Dr." "U.S." "J. R. R." etc.
const ABBR = /\b(?:mr|mrs|ms|dr|st|jr|sr|vs|etc|no|inc|ltd|co|mt|ft|approx|ca|e\.g|i\.e|u\.s|u\.k|jan|feb|mar|apr|jun|jul|aug|sep|sept|oct|nov|dec|[a-z])\.$/i;
function splitSentences(text) {
  const out = [];
  const parts = text.replace(/\s+/g, " ").split(/(?<=[.!?])\s+(?=["'(\[]?[A-Z0-9])/);
  let buf = "";
  for (const p of parts) {
    buf = buf ? buf + " " + p : p;
    if (ABBR.test(buf)) continue;     // ended on an abbreviation -> keep gluing
    out.push(buf.trim()); buf = "";
  }
  if (buf.trim()) out.push(buf.trim());
  return out;
}
// Wikipedia plain text sometimes leaves junk like "( ; )" where a pronunciation was
function tidy(s) {
  return s.replace(/\(\s*[;,]?\s*(listen|help)?\s*\)/gi, "")
          .replace(/\(\s*[;,]\s*/g, "(").replace(/\s*[;,]\s*\)/g, ")")
          .replace(/\(\s*\)/g, "")
          .replace(/\s+([,.;:])/g, "$1").replace(/\s{2,}/g, " ").trim();
}
// how similar are two sentences? (Jaccard overlap of their words, 0..1)
function overlap(a, b) {
  const A = new Set(keyTerms(a)), B = new Set(keyTerms(b));
  if (!A.size || !B.size) return 0;
  let n = 0; A.forEach(w => { if (B.has(w)) n++; });
  return n / (A.size + B.size - n);
}

/* =====================================================================
   PART 2 - THE SUMMARY ENGINE (our homemade "AI Overview")
   ===================================================================== */
const WIKI = "https://en.wikipedia.org/w/api.php";
const SKIP_SECTIONS = /^(references|see also|notes|external links|further reading|bibliography|sources|citations|footnotes|gallery|discography|filmography|videography|awards and nominations|tours|works cited|explanatory notes|selected works|publications|list of .*)$/i;
const wikiCache = new Map();   // remember articles so "regenerate" is instant

function wikiURL(params) {
  const p = new URLSearchParams({action: "query", format: "json", formatversion: "2", origin: "*", ...params});
  return WIKI + "?" + p.toString();
}

// Search Wikipedia and get the intro of each result + its picture
async function wikiSearch(query) {
  const data = await getJSON(wikiURL({
    generator: "search", gsrsearch: query, gsrlimit: "6", redirects: "1",
    prop: "extracts|pageimages|info|pageprops", exintro: "1", explaintext: "1", exlimit: "6",
    piprop: "thumbnail", pithumbsize: "640", pilimit: "6", inprop: "url", ppprop: "disambiguation"
  }));
  const pages = (data.query && data.query.pages) || [];
  return pages.filter(p => !p.missing && p.extract && !(p.pageprops && "disambiguation" in p.pageprops))
              .sort((a, b) => a.index - b.index);
}
// Get the WHOLE article text (with == Section == headings) for one page
async function wikiFull(title) {
  const data = await getJSON(wikiURL({prop: "extracts", explaintext: "1", exsectionformat: "wiki", titles: title, redirects: "1"}));
  const p = data.query && data.query.pages && data.query.pages[0];
  return (p && p.extract) || "";
}
async function wikiSuggest(query) {
  try {
    const d = await getJSON(wikiURL({list: "search", srsearch: query, srinfo: "suggestion", srlimit: "1"}));
    return d.query && d.query.searchinfo && d.query.searchinfo.suggestion;
  } catch (e) { return null; }
}

// Turn an article into a list of sentence objects {text, section, pos, intro}
function toSentences(text, pageRank, title, introOnly) {
  const list = [];
  let section = "Intro", pos = 0;
  for (const block of text.split(/\n+/)) {
    const h = block.match(/^=+\s*(.+?)\s*=+$/);
    if (h) { section = h[1]; continue; }
    if (SKIP_SECTIONS.test(section)) continue;
    if (block.length < 30) continue;                       // captions, list items
    for (const raw of splitSentences(block)) {
      const s = tidy(raw);
      if (s.length < 40 || s.length > 420) { pos++; continue; }
      if (!/[.!?]["')]?$/.test(s)) { pos++; continue; }       // not a full sentence
      list.push({text: s, section, pos: pos++, intro: introOnly || section === "Intro", page: pageRank, title,
                 terms: keyTerms(s)});
    }
  }
  return list;
}

// Words that hint a sentence EXPLAINS something (good for how/why questions)
const HOW_CUES = new Set(["because","cause","caused","causes","result","process","form","forms","allow","through","due","produce","produced","creates","created","occur","occurs","happen","scatter","scattered","scattering","absorb","absorbed","energy","pressure","heat"].map(stem));

// The scoring brain: TF-IDF + title boost + position + length rules
function scoreSentences(sents, q) {
  const N = sents.length || 1, df = new Map();
  for (const s of sents) new Set(s.terms).forEach(t => df.set(t, (df.get(t) || 0) + 1));
  const idf = t => Math.log(1 + N / (1 + (df.get(t) || 0)));
  for (const s of sents) {
    const tf = new Map();
    s.terms.forEach(t => tf.set(t, (tf.get(t) || 0) + 1));
    let score = 0, hit = 0;
    for (const t of q.terms) {
      const c = tf.get(t);
      if (c) { score += idf(t) * (1 + Math.log(c)); hit++; }
    }
    const coverage = q.terms.length ? hit / q.terms.length : 0;
    score *= 0.4 + coverage;                               // matching MORE of the question = better
    if (q.how) s.terms.forEach(t => { if (HOW_CUES.has(t)) score += 0.35; });
    if (q.sectionTerms.length && keyTerms(s.section).some(t => q.sectionTerms.includes(t))) score *= 1.6;
    if (s.intro) score = score * (q.who ? 1.8 : 1.4) + 1.2; // intros are written as summaries
    score *= [1, 0.45, 0.32, 0.3, 0.3, 0.3][s.page] || 0.3; // sentences from the best page count most
    const quotes = (s.text.match(/["\u201c\u201d]/g) || []).length;
    if (quotes >= 4) score *= quotes >= 6 ? 0.4 : 0.6;   // long quotes read badly in a summary
    score *= 1 / (1 + s.pos / 60);                         // earlier in the article = more important
    const L = s.text.length;
    if (L < 70) score *= 0.75; if (L > 300) score *= 0.75;  // too short or rambling
    if (/^(however|also|additionally|furthermore|moreover|this|these|it|they|he|she|in addition)\b/i.test(s.text) && !s.intro) score *= 0.5;
    s.score = score;
  }
  return sents;
}

// Rank candidate pages: search position + how well the title / intro match the question
function rankPages(pages, q) {
  for (const p of pages) {
    const tt = keyTerms(p.title);
    const tHit = tt.filter(t => q.terms.includes(t)).length;
    const titleMatch = tt.length ? tHit / tt.length : 0;
    const introTerms = new Set(keyTerms(p.extract.slice(0, 1500)));
    const introHit = q.terms.length ? q.terms.filter(t => introTerms.has(t)).length / q.terms.length : 0;
    // how/why questions: does the intro EXPLAIN things? (because, caused, process...)
    const explain = q.how ? Math.min(3, [...introTerms].filter(t => HOW_CUES.has(t)).length) * 0.25 : 0;
    p.rank = p.prior + titleMatch * (q.how ? 0.5 : 1.1) + introHit * 0.9 + explain
           + (/\(disambiguation\)|^list of/i.test(p.title) ? -2 : 0);
  }
  return pages.sort((a, b) => b.rank - a.rank);
}

// Understand the question a bit
function parseQuestion(question, ctx) {
  let qText = question.trim();
  const lower = qText.toLowerCase();
  // Follow-up questions: "how old is she?" -> use the last topic we talked about
  let followTopic = null;
  const kws = words(lower).filter(w => !STOP.has(w));
  if (ctx && ctx.topic && /\b(he|she|it|they|him|her|his|its|their|them|this|that)\b/.test(lower) && kws.length <= 3) {
    followTopic = ctx.topic;
  }
  const keywords = kws.join(" ");
  const terms = [...new Set(keyTerms(qText + (followTopic ? " " + followTopic : "")))];
  return {
    raw: qText, keywords, followTopic, terms,
    // terms that look like they name a SECTION (e.g. "early life", "history")
    sectionTerms: keyTerms(qText).filter(t => !(followTopic && keyTerms(followTopic).includes(t))),
    how: /^(how|why)\b/.test(lower) || /\b(how does|how do|how is|how are|why)\b/.test(lower),
    who: /^who (is|was|are|were)\b/.test(lower),
    old: /\b(how old|age of|when was .* born|birthday|born)\b/.test(lower)
  };
}

// Pick the best sentences, skipping near-duplicates. "variant" lets REGENERATE
// skip the ones we already showed and use the next-best sentences instead.
function chooseSentences(pool, lead, count, variant) {
  const ranked = pool.filter(s => s !== lead).sort((a, b) => b.score - a.score);
  const unique = [];
  for (const s of ranked) {
    if (unique.length >= 40) break;
    if (overlap(lead.text, s.text) > 0.5 || unique.some(c => overlap(c.text, s.text) > 0.5)) continue;
    unique.push(s);
  }
  let start = variant * count;
  if (start + count > unique.length) start = 0;        // ran out? wrap around to the top
  return unique.slice(start, start + count);
}

// Special "direct answer": how old is someone?
const MONTHS = ["january","february","march","april","may","june","july","august","september","october","november","december"];
function ageFrom(text) {
  if (/\bdied\b|\u2013\s*[A-Z][a-z]+ \d|\d{4}\s*\u2013\s*\d{4}/.test(text.slice(0, 300)) && !/\(born/.test(text.slice(0, 300))) return null;
  let m = text.match(/born\s+(?:on\s+)?([A-Z][a-z]+)\s+(\d{1,2}),\s+(\d{4})/) ;
  let d;
  if (m) d = new Date(+m[3], MONTHS.indexOf(m[1].toLowerCase()), +m[2]);
  else if ((m = text.match(/born\s+(?:on\s+)?(\d{1,2})\s+([A-Z][a-z]+)\s+(\d{4})/))) d = new Date(+m[3], MONTHS.indexOf(m[2].toLowerCase()), +m[1]);
  if (!d || isNaN(d) || d.getMonth() < 0) return null;
  const now = new Date();
  let age = now.getFullYear() - d.getFullYear();
  if (now < new Date(now.getFullYear(), d.getMonth(), d.getDate())) age--;
  return {age, born: d.toLocaleDateString("en-US", {month: "long", day: "numeric", year: "numeric"})};
}

async function wikiAnswer(question, ctx, variant = 0) {
  const q = parseQuestion(question, ctx);
  // 1) Search Wikipedia twice at the same time: with just the keywords, and with the whole question
  const queries = [];
  const base = (q.followTopic ? q.followTopic + " " : "") + (q.keywords || q.raw);
  queries.push(base);
  if (!q.followTopic && q.raw.toLowerCase() !== base.toLowerCase()) queries.push(q.raw.replace(/[?!.]+$/, ""));
  const cacheKey = queries.join("|");
  let data = wikiCache.get(cacheKey);
  if (!data) {
    const results = await Promise.all(queries.map(s => wikiSearch(s).catch(() => [])));
    // merge the two result lists. For how/why questions the whole-question search
    // is usually smarter (it finds "Diffuse sky radiation" instead of the color "Sky blue")
    const byTitle = new Map();
    results.forEach((list, li) => list.forEach((p, i) => {
      const w = (li === 1 && q.how ? 1.3 : 0.6) / (1 + i);
      const old = byTitle.get(p.title);
      if (old) old.prior += w;
      else byTitle.set(p.title, {...p, prior: w});
    }));
    let pages = [...byTitle.values()];
    if (!pages.length) {                      // nothing? try Wikipedia's "did you mean"
      const sug = await wikiSuggest(base);
      if (sug) pages = (await wikiSearch(sug).catch(() => [])).map((p, i) => ({...p, prior: 0.6 / (1 + i)}));
    }
    if (!pages.length) return null;
    if (q.followTopic) {
      // Follow-up question ("how old is she?"): make sure the article we were
      // just talking about is in the list, and keep it in first place.
      if (!pages.some(p => p.title === q.followTopic)) {
        const own = (await wikiSearch(q.followTopic).catch(() => [])).find(p => p.title === q.followTopic);
        if (own) pages.push({...own, prior: 0});
      }
      pages.forEach(p => { if (p.title === q.followTopic) p.prior += 3; });
    }
    pages = rankPages(pages, q);
    const mine = q.followTopic ? pages.findIndex(p => p.title === q.followTopic) : -1;
    if (mine > 0) pages.unshift(pages.splice(mine, 1)[0]);
    pages = pages.slice(0, 3);
    // 2) Read the whole top article (other pages: just their intros)
    const full = await wikiFull(pages[0].title).catch(() => "");
    data = {pages, full};
    wikiCache.set(cacheKey, data);
  }
  const {pages, full} = data;
  // 3) Sentences + scores
  let pool = toSentences(full || pages[0].extract, 0, pages[0].title, !full);
  pages.slice(1).forEach((p, i) => { pool = pool.concat(toSentences(p.extract, i + 1, p.title, true)); });
  if (!pool.length) return null;
  scoreSentences(pool, q);
  const top = pages[0];
  // The first sentence of the best article is (almost always) the definition -> lead with it
  const lead = pool.find(s => s.page === 0 && s.intro) || pool.slice().sort((a, b) => b.score - a.score)[0];
  // the paragraph uses the best article; other pages only help if it is short
  const main = pool.filter(s => s.page === 0);
  const extra = chooseSentences(main.length >= 8 ? main : pool, lead, 3, variant);
  // sort chosen sentences so the paragraph reads in a natural order
  const paraSents = [lead, ...extra.sort((a, b) => a.page - b.page || a.pos - b.pos)];
  // "Key points": best sentence from 3 different sections of the main article
  const used = new Set(paraSents);
  const bySection = new Map();
  pool.filter(s => s.page === 0 && !s.intro && !used.has(s) && !paraSents.some(p => overlap(p.text, s.text) > 0.4))
      .sort((a, b) => b.score - a.score)
      .forEach(s => { if (!bySection.has(s.section)) bySection.set(s.section, s); });
  const sections = [...bySection.values()];
  const kpStart = (variant * 3) + 3 > sections.length ? 0 : variant * 3;
  const kp = sections.slice(kpStart, kpStart + 3).sort((a, b) => a.pos - b.pos);   // keep article order
  const bullets = kp.map(s => ({h: s.section, t: s.text}));

  // bold the topic name the first time it appears
  let para = paraSents.map(s => s.text).join(" ");
  const tname = top.title.replace(/\s*\(.*\)$/, "");
  const ix = para.toLowerCase().indexOf(tname.toLowerCase());
  if (ix >= 0 && ix < 200) para = para.slice(0, ix) + "**" + para.slice(ix, ix + tname.length) + "**" + para.slice(ix + tname.length);

  // Direct answer box for "how old is ..."
  let html = "";
  if (q.old) {
    const a = ageFrom(top.extract);
    if (a) html = `<div class="box"><div class="muted small">${esc(tname)} &middot; age</div><div class="big grad">${a.age} years old</div><div class="muted small">Born ${esc(a.born)}</div></div>`;
  }

  // Related questions from the article's sections + the other pages
  const heads = [...new Set(full.split("\n").map(l => (l.match(/^==\s*([^=].*?)\s*==$/) || [])[1]).filter(Boolean))]
      .filter(h => !SKIP_SECTIONS.test(h) && h.length < 40);
  const related = [];
  const pickHeads = heads.slice(variant % 2 ? 2 : 0);
  for (const h of pickHeads) { if (related.length >= 2) break; related.push(`${tname} ${h.toLowerCase()}`); }
  pages.slice(1).forEach(p => related.length < 4 && related.push(`Tell me about ${p.title.replace(/\s*\(.*\)$/, "")}`));


  const sources = pages.map(p => ({title: p.title, url: p.fullurl || ("https://en.wikipedia.org/wiki/" + encodeURIComponent(p.title.replace(/ /g, "_"))),
                                   site: "Wikipedia", snip: tidy(p.extract.slice(0, 120)) + "..."}));
  const img = top.thumbnail ? {src: top.thumbnail.source, alt: top.title} : null;
  const plain = para.replace(/\*\*/g, "") + (bullets.length ? "\n\nKey points:\n" + bullets.map(b => "- " + b.h + ": " + b.t).join("\n") : "");
  return {kind: "wiki", badge: `Summary from ${pages.length} source${pages.length > 1 ? "s" : ""}`, html, paras: [para], bullets,
          image: img, sources, related: related.slice(0, 4), plain, topic: top.title,
          why: `Picked the ${paraSents.length + bullets.length} best-matching sentences out of ${pool.length} by word scoring.`};
}

/* =====================================================================
   PART 3 - SKILLS (each one is plain rules + code, no AI)
   ===================================================================== */

/* ---------- 3a. SAFE CALCULATOR ----------
   We never use eval(). Instead a small "recursive descent parser"
   reads the math one token at a time, following the order of operations:
     expr   = term   (+|- term)*
     term   = unary  (*|/ unary)*
     unary  = -unary | power
     power  = postfix (^ unary)?
     postfix= primary (! | %)*
     primary= number | (expr) | function(expr) | constant          */
const FUNCS = {sqrt: Math.sqrt, cbrt: Math.cbrt, abs: Math.abs, round: Math.round, floor: Math.floor, ceil: Math.ceil,
  sin: x => Math.sin(x * Math.PI / 180), cos: x => Math.cos(x * Math.PI / 180), tan: x => Math.tan(x * Math.PI / 180),
  log: Math.log10, ln: Math.log, exp: Math.exp};
const CONSTS = {pi: Math.PI, e: Math.E, tau: Math.PI * 2};
function factorial(n) { if (n < 0 || !Number.isInteger(n) || n > 170) return NaN; let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; }

function tokenize(src) {
  const toks = [], re = /\s*(\d+(?:\.\d*)?(?:e[+-]?\d+)?|\.\d+|[a-z]+|[-+*/^()!%,])/gy;
  let m, last = 0;
  while (last < src.length && (m = re.exec(src))) { toks.push(m[1]); last = re.lastIndex; }
  if (src.slice(last).trim()) throw new Error("bad char");
  return toks;
}
function calc(src) {
  const t = tokenize(src); let i = 0;
  const peek = () => t[i], next = () => t[i++];
  const expect = c => { if (next() !== c) throw new Error("expected " + c); };
  function expr() { let v = term(); while (peek() === "+" || peek() === "-") v = next() === "+" ? v + term() : v - term(); return v; }
  function term() {
    let v = unary();
    for (;;) {

/* =====================================================================
   PART 4 - THE ROUTER: decide which skill answers
   ===================================================================== */
async function route(text, ctx, variant = 0) {
  const s = text.toLowerCase().replace(/\u2019/g, "'").replace(/\s+/g, " ").trim();
  const bare = s.replace(/[?!.]+$/, "").trim();
  let m;

  // your name
  if ((m = text.match(/^(?:call me|my name is|my name's)\s+([A-Za-z][A-Za-z' -]{0,24})[.!]*$/i))) {
    const n = cap(m[1].trim()); localStorage.setItem("electron_name", n);
    return {kind: "talk", paras: [`Got it, I'll call you **${n}** from now on!`], plain: `Okay, ${n}!`};
  }
  // "another one" / "again" -> repeat the last kind of fun answer
  if (/^(another( one)?|one more|again|more|next|flip again|another joke|another fun fact|another fact)$/.test(bare) && ctx.lastAgain) {
    if (/joke/.test(bare) || (!/fact/.test(bare) && ctx.lastKind === "joke")) return jokeAnswer();
    if (/fact/.test(bare) || ctx.lastKind === "fact") return factAnswer();
    if (ctx.lastQuery) return route(ctx.lastQuery, {}, variant);
  }
  let a;
  if ((a = talkAnswer(bare))) return a;
  if ((a = baseAnswer(text))) return a;
  if ((a = mathAnswer(text))) return a;
  if ((a = unitAnswer(text))) return a;

  // time & date
  if ((m = bare.match(/^(?:what(?:'s| is) the |what )?time(?: is it)?(?: right now| now)? in (.+)$/)) || (m = bare.match(/^(?:what )?time is it in (.+)$/)) || (m = bare.match(/^(?:current |local )time in (.+)$/)))
    return timeAnswer(m[1]);
  if (/^(what(?:'s| is) the time|what time is it|current time|time|time now|what's the time now)$/.test(bare)) return timeAnswer(null);
  if (/(what(?:'s| is)? ?(the |today'?s )?date|what day is (it|today)|today'?s date|what is today)/.test(bare)) return timeAnswer(null);
  if ((m = bare.match(/(?:how (?:many|long) )?(?:days?|time|long) (?:until|till|til|to|left until|left till|before) (.+)$/))) {
    const c = countdownAnswer(m[1]); if (c) return c;
  }
  // weather
  if ((m = bare.match(/^(?:what(?:'s| is) the |how(?:'s| is) the |show me the |the )?(?:weather|temperature|temp|forecast)(?: like| today| right now| now)?(?:\s+(?:in|for|at)\s+(.+?))?(?:\s+(?:in )?(celsius|fahrenheit|c|f))?$/)) ||
      (m = bare.match(/^(?:what(?:'s| is) the )?weather (?:like )?(?:in|for|at) (.+?)(?:\s+(?:in )?(celsius|fahrenheit))?$/)) ||
      (m = bare.match(/^(.+?) weather()$/)) ||
      (m = bare.match(/^(?:is it|will it) (?:raining|snowing|hot|cold|sunny|rain|snow) (?:in|at) (.+?)()$/)) ||
      (m = bare.match(/^how (?:hot|cold|warm) is it (?:in|at) (.+?)()$/))) {
    const city = (m[1] || "").replace(/\b(today|now|right now|tomorrow|this week)\b/g, "").trim() || localStorage.getItem("electron_city");
    if (!city) return {kind: "weather", paras: ["Which city? Try **weather in New York** or **weather in London**."], plain: "Which city?", related: ["Weather in New York", "Weather in Los Angeles", "Weather in London"]};
    const wa = await weatherAnswer(city, m[2] ? /^c/.test(m[2]) : undefined);
    if (wa) return wa;
    if (/^(weather|forecast)/.test(bare)) return {kind: "weather", paras: [`I couldn't find a place called "${city}". Try a bigger city name, like "weather in Miami".`], plain: "City not found."};
  }
  if ((a = randomAnswer(bare))) return a;
  if (/\b(joke|make me laugh|something funny|pun)\b/.test(bare)) return jokeAnswer();
  if (/\b(fun fact|random fact|a fact|interesting fact|did you know|teach me something)\b/.test(bare)) return factAnswer();

  // dictionary
  if ((m = bare.match(/^(?:define|definition of|meaning of|what is the meaning of|what's the meaning of|what is the definition of|dictionary)\s+(?:the word\s+)?["']?([a-z' -]+?)["']?$/)) ||
      (m = bare.match(/^what does (?:the word )?["']?([a-z' -]+?)["']? mean$/)) || (m = bare.match(/^["']?([a-z'-]+)["']? (?:meaning|definition)$/))) {
    const d = await defineAnswer(m[1]);
    if (d) return d;
  }
  // everything else -> the Wikipedia summary engine
  const w = await wikiAnswer(text, ctx, variant);
  if (w) return w;
  return notFound(text);
}
function notFound(text) {
  return {kind: "none", paras: [`I couldn't find a good answer for "${text}". My brain only knows what I can find on Wikipedia and a few free data sources, so try different words, or search the whole web:`],
    plain: "No answer found.", sources: [{title: `Search Google for "${text}"`, url: "https://www.google.com/search?q=" + encodeURIComponent(text), site: "Google", snip: "Open a regular web search in a new tab."}],
    related: ["Tell me a fun fact", "What can you do?"]};
}

command === "tell me about electron"
) {
addElectronMessage(
"I\u2019m Electron, your personal virtual assistant."
);
return true;
}

if (
command === "who made you" ||
command === "who created you"
) {
addElectronMessage(
"I was created as Electron, a personal assistant."
);
return true;
}

if (
command === "are you real" ||
command === "are you a real person"
) {
addElectronMessage(
"I\u2019m a virtual assistant, not a person."
);
return true;
}

if (
command === "are you an ai" ||
command === "are you ai"
) {
addElectronMessage(
"No, there\u2019s no AI inside me. I answer with my own code: I search Wikipedia, score every sentence, and show you the best ones."
);
return true;
}

if (
command === "are you smart" ||
command === "are you intelligent"
) {
addElectronMessage(
"I know what I\u2019ve been programmed to do. For big questions I read Wikipedia and pick the sentences that match your question best."
);
return true;
}

if (
command === "what can you do" ||
command === "what do you do" ||
command === "what can i ask you"
) {
addElectronMessage(
"I can summarize almost any topic from Wikipedia, do math, convert units, define words, check the weather anywhere, tell the time in other cities, count down to holidays, set 1\u20135 minute timers, tell jokes and facts, and help you search the web."
);
return true;
}

if (
command === "help" ||
command === "i need help" ||
command === "can you help" ||
command === "can you help me" ||
command === "commands" ||
command === "list of commands" ||
command === "command list" ||
command === "show commands" ||
command === "show me the commands" ||
command === "list commands" ||
command === "tell me the commands"
) {
showCommands();
return true;
}

/* DATE & TIME */

if (
command === "date" ||
command === "today" ||
command.includes("what's the date") ||
command.includes("what is the date") ||
command.includes("what day is it") ||
command.includes("what day is today")
) {
addElectronMessage("Today is " + getDate() + ".");
return true;
}

if (
command === "what month is it" ||
command === "what month is this"
) {
addElectronMessage(
"It\u2019s " +
new Date().toLocaleDateString(undefined, {
month: "long"
}) + "."
);
return true;
}

if (
command === "what year is it" ||
command === "what year is this"
) {
addElectronMessage(
"It\u2019s " + new Date().getFullYear() + "."
);
return true;
}

if (
command === "time" ||
command === "what time is it" ||
command === "what time is it now" ||
command === "what's the time" ||
command === "what is the time"
) {
addElectronMessage("It\u2019s " + getTime() + ".");
return true;
}

/* TIMERS */

const timerMatch = command.match(
/^(?:set\s+)?(?:a\s+)?timer(?:\s+for)?\s+(\d+)\s*(minutes?|mins?|m)$/
);

if (timerMatch) {
const minutes = Number(timerMatch[1]);

if (minutes >= 1 && minutes <= 5) {
startTimer(minutes);
} else {
addElectronMessage(
"I can only set timers from 1 to 5 minutes."
);
}

return true;
}

if (
command === "stop" ||
command === "cancel" ||
command === "cancel timer" ||
command === "stop timer"
) {
if (!cancelTimer()) {
addElectronMessage("There isn\u2019t an active timer.");
}
return true;
}

/* GREETINGS BY TIME OF DAY */

if (command === "good morning") {
addElectronMessage("Good morning! \u2600\ufe0f");
return true;
}

if (command === "good afternoon") {
addElectronMessage("Good afternoon!");
return true;
}

if (command === "good evening") {
addElectronMessage("Good evening!");
return true;
}

if (command === "good night" || command === "goodnight") {
addElectronMessage("Good night!");
return true;
}

if (command === "goodbye" || command === "bye") {
addElectronMessage("Goodbye! \u2600\ufe0f");
return true;
}

if (
command === "thanks" ||
command === "thank you" ||
command === "thanks electron"
) {
addElectronMessage("You\u2019re welcome!");
return true;
}

if (
command === "you're welcome" ||
command === "you are welcome"
) {
addElectronMessage("Thank you!");
return true;
}

/* JOKES, FACTS, COINS, DICE, NUMBERS
These now come from the answer engine
below (it has a bigger joke + fact list).
"fact" and "surprise me" are sent to it
as "tell me a fun fact". */

if (
command === "fact" ||
command === "surprise me"
) {
await answerWithEngine("tell me a fun fact", currentRequest);
return true;
}

if (
command === "say something" ||
command === "tell me something"
) {
addElectronMessage("Hello from Electron! \u2600\ufe0f");
return true;
}

if (command === "entertain me") {
addElectronMessage(
"Here I am! \u2600\ufe0f What would you like to ask?"
);
return true;
}

/* PERSONALITY */

if (command === "do you like me") {
addElectronMessage("Of course! \u2600\ufe0f");
return true;
}

if (command === "are you my assistant") {
addElectronMessage(
"Yes. I\u2019m Electron, your personal assistant."
);
return true;
}

if (
command === "are you listening" ||
command === "can you hear me"
) {
addElectronMessage("I\u2019m listening.");
return true;
}

if (command === "wake up" || command === "hey there") {
addElectronMessage(
"I\u2019m here. How can I help you?"
);
return true;
}

if (command === "nice to meet you") {
addElectronMessage("Nice to meet you too!");
return true;
}

if (
command === "what is your favorite color" ||
command === "do you have a favorite color"
) {
addElectronMessage("Yellow. \u2600\ufe0f");
return true;
}

/* VERSION */

if (
command === "version" ||
command === "electron version" ||
command === "what is your version"
) {
addElectronMessage(
"Electron | Version 3.0 Special Edition | Made in New York | Electron \u2122"
);
return true;
}

/* WEATHER */

if (
command === "weather" ||
command === "what's the weather" ||
command === "what is the weather" ||
command.includes("weather today") ||
command.includes("weather right now") ||
command.includes("how is the weather")
) {
/* A city was named ("weather today in London")?
Let the engine look that city up instead. */
if (/\b(in|for|at)\s+\w/.test(command)) {
await answerWithEngine(text, currentRequest);
return true;
}

await getWeather();
return true;
}

/* MATH, UNIT CONVERSIONS, DAYS UNTIL
These moved into the answer engine below:
its calculator never uses eval(), and it
knows a lot more units and holidays. */

/* WEB SEARCH */

const searchPrefixes = [
"search the web for ",
"search for ",
"google ",
"look up ",
"find "
];

for (const prefix of searchPrefixes) {
if (command.startsWith(prefix)) {
const query = text.slice(prefix.length).trim();

if (query) {
webSearchReply(query);
} else {
addElectronMessage("What would you like me to search for?");
}

return true;
}
}

/* OPEN WEBSITES */

const websites = {
"open google": "https://www.google.com",
"open youtube": "https://www.youtube.com",
"open wikipedia": "https://www.wikipedia.org"
};

if (websites[command]) {
window.open(
websites[command],
"_blank",
"noopener,noreferrer"
);

addElectronMessage(
"Opening " +
command.replace("open ", "") + "."
);

return true;
}

/* EVERYTHING ELSE: THE ANSWER ENGINE
(time in other cities, Wikipedia summaries,
math, units, definitions... see below) */

await answerWithEngine(text, currentRequest);
return true;
}

/* =========================================
SEND MESSAGE
========================================= */

async function askElectron() {
const text = input.value.trim();

if (!text) {
return;
}

input.value = "";
input.focus();

requestNumber++;
const currentRequest = requestNumber;

addUserMessage(text);
addThinking();

try {
removeThinking();
await handleCommand(text, currentRequest);
} catch (error) {
console.error("Electron command error:", error);
removeThinking();

addElectronMessage(
"Something went wrong while processing that request. Please try again."
);
}
}

/* =========================================
FORM SUBMISSION
========================================= */

document
.getElementById("inputForm")
.addEventListener("submit", function(event) {
event.preventDefault();
askElectron();
});

</script>
